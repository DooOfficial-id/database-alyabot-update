<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#080d18">

    <title>Dashboard | Database Alya-Botz © 2026 by YT @sky_doo</title>

    <link rel="icon" type="image/png" href="/doo/favicon.png?v=2">
    <link rel="shortcut icon" type="image/png" href="/doo/favicon.png?v=2">

    <link rel="stylesheet" href="/style.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>
    <main class="dashboard-container">

        <header class="dashboard-header">
            <div class="brand">
                <img src="/doo/logo.png" alt="Alya-Botz" class="brand-logo">
                <div>
                    <h1>Dtbs Alya-Botz</h1>
                    <p>Panel pengelolaan database nomor</p>
                </div>
            </div>

            <button type="button" id="themeBtn"
                    class="theme-btn" onclick="toggleTheme()"
                    aria-label="Ganti tema">
                <i class="fas fa-moon"></i>
            </button>
        </header>

        <section class="dashboard-card">
            <div class="section-heading">
                <div>
                    <h2><i class="fas fa-database"></i> Database </h2>
                    <p>Database load.</p>
                </div>

                <button type="button" class="refresh-btn"
                        onclick="loadNumbers()">
                    <i class="fas fa-rotate"></i> Refresh
                </button>
            </div>

            <div class="stats-row">
                <div class="stat-box">
                    <span>Total Nomor</span>
                    <strong id="totalNumbers">0</strong>
                </div>

                <div class="stat-box">
                    <span>Status Active</span>
                    <strong id="activeNumbers">0</strong>
                </div>
            </div>

            <form id="addNumberForm" class="add-number-form">
                <label for="phoneInput">Tambah Nomor</label>

                <div class="input-row">
                    <input
                        type="tel"
                        id="phoneInput"
                        placeholder="Contoh: 6281234567890"
                        autocomplete="off"
                        required
                    >

                    <button type="submit" id="addNumberBtn">
                        <i class="fas fa-plus"></i> Tambah
                    </button>
                </div>
            </form>

            <div class="table-toolbar">
                <label for="searchInput">Daftar Nomor</label>

                <div class="search-box">
                    <i class="fas fa-search"></i>
                    <input
                        type="search"
                        id="searchInput"
                        placeholder="Cari nomor..."
                        autocomplete="off"
                    >
                </div>
            </div>

            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Nomor Telepon</th>
                            <th>Status</th>
                        </tr>
                    </thead>

                    <tbody id="dataTableBody">
                        <tr>
                            <td colspan="2" class="loading-cell">
                                Memuat database...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <p id="databaseMessage" class="database-message"
               role="status" aria-live="polite"></p>
        </section>

        <footer class="dashboard-footer">
            <p>Database Alya-Botz &copy; 2026</p>
        </footer>

    </main>

    <script src="/script.js"></script>

    <script>
        // Form menggunakan fungsi addNumber() dari script.js.
        document.getElementById("addNumberForm")
            .addEventListener("submit", function (event) {
                event.preventDefault();
                addNumber();
            });

        // Pencarian tabel.
        document.getElementById("searchInput")
            .addEventListener("input", searchTable);

        // Tampilkan jumlah nomor setelah tabel diperbarui.
        const originalRenderTable = renderTable;

        renderTable = function (data) {
            originalRenderTable(data);

            const total = document.getElementById("totalNumbers");
            const active = document.getElementById("activeNumbers");

            if (total) {
                total.textContent = numbersData.length;
            }

            if (active) {
                active.textContent = numbersData.filter(
                    item => item.status.toLowerCase() === "active"
                ).length;
            }
        };

        // Pastikan data ditampilkan saat dashboard dibuka.
        if (sessionStorage.getItem("alyabotSession")) {
            loadNumbers();
        }
    </script>
</body>
</html>
