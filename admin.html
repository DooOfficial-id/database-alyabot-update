<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Database Alya Bot</title>
    <link rel="icon" type="image/png" href="doo/favicon.png">\n    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .delete-btn {
            background: #ef4444;
            color: white;
            border: none;
            padding: 6px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: 0.2s;
        }
        .delete-btn:hover {
            background: #dc2626;
            transform: scale(1.05);
        }
        body.dark-mode .delete-btn {
            background: #b91c1c;
        }
        body.dark-mode .delete-btn:hover {
            background: #991b1b;
        }
        .admin-login-box {
            text-align: center;
            margin-bottom: 20px;
        }
        .admin-login-box input {
            padding: 10px 16px;
            border-radius: 10px;
            border: 1px solid #ccc;
            margin-right: 10px;
            font-size: 14px;
        }
        .admin-login-box button {
            padding: 10px 20px;
            border-radius: 10px;
            background: #4f46e5;
            color: white;
            border: none;
            font-weight: bold;
            cursor: pointer;
        }
        .admin-login-box button:hover {
            background: #4338ca;
        }
    </style>
</head>
<body>
    <button class="theme-toggle" onclick="toggleTheme()" id="themeBtn">
        <i class="fas fa-moon"></i>
    </button>

    <div class="container">
        <div class="card">
            <div class="header-image">
                <div class="robot-avatar">
                    <img src="doo/logo.png" alt="Database Alya Bot Logo">
                </div>
                <h2>Database Alya Bot</h2>
                <span class="badge">By @skydoo_id</span>
                <div class="online-status">ONLINE</div>
            </div>

            <div class="dashboard-section">
                <h3>Admin - Dash</h3>
                <p class="subtitle">Masukkan password admin untuk menghapus nomor</p>

                <!-- Login Admin -->
                <div class="admin-login-box" id="adminLoginBox">
                    <input type="password" id="adminPasswordInput" placeholder="Password Admin">
                    <button onclick="adminLogin()">Login Admin</button>
                </div>

                <!-- Search Bar (hanya muncul setelah login) -->
                <div class="search-group" id="searchSection" style="display: none;">
                    <i class="fas fa-search"></i>
                    <input type="text" id="searchInput" placeholder="Cari nomor..." onkeyup="searchTable()">
                </div>

                <!-- Tabel Data (hanya muncul setelah login) -->
                <div class="table-container" id="tableSection" style="display: none;">
                    <table>
                        <thead>
                            <tr>
                                <th>Number</th>
                                <th>Status</th>
                                <th>Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="dataTableBody"></tbody>
                    </table>
                </div>

                <div class="footer-dashboard">
                    <a href="dashboard.html">⬅ Kembali ke Dashboard</a>
                </div>
            </div>
        </div>
    </div>
    <script src="admin.js"></script>
</body>
</html>
